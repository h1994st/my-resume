<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>my-resume</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <header class="site-title">
      <h1>my-resume</h1>
      <p>A LaTeX resume you can <code>git diff</code>, tailored per job with Claude Code.</p>
      <a href="https://github.com/h1994st/my-resume">GitHub</a>
    </header>

    <section class="stage" id="stage" aria-label="Workflow demo (a scripted replay)">
      <div class="stage-term" id="term"></div>
      <div class="stage-page" id="page-col">
        <div class="page-box" id="page-box">
          <div class="page-replica" id="resume-host"></div>
          <figure class="proof" data-proof="tailored">
            <img
              src="img/tailored-1.png"
              alt="The tailored resume's first page, as the real PDF renders it"
              width="935"
              height="1210"
            />
            <figcaption>The real PDF, built by CI from this commit</figcaption>
          </figure>
          <p class="demo-tag" title="The Granary role is not in the repo">
            Demo step: this role is not in the repo
          </p>
        </div>
      </div>
      <div class="stage-controls" id="controls"></div>
    </section>
  </body>
</html>
